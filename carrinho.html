<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="carrinho.css">
</head>
<body>

    <div class="carrinho-container">

      <h1>🛒 Finalizar Pedido</h1>

<p class="subtitulo">
Confira seus itens antes de enviar para o WhatsApp.
</p>

        <div id="carrinho-box">
            <div id="lista-carrinho"></div>

            
<div class="total-box">
    <div>
        <p>Subtotal: R$ <span id="subtotal">0.00</span></p>
        <p>Taxa de entrega: R$ <span id="taxa-entrega">0.00</span></p>
        <h3>Total: R$ <span id="total">0.00</span></h3>
    </div>
</div>

<div class="dados-cliente">
    <h3>Dados para entrega</h3>

    <label>Nome:</label>
    <input type="text" id="nome-cliente" placeholder="Digite seu nome">

   
<label>Tipo do pedido:</label>
<select id="tipo-entrega" onchange="atualizarTotalCarrinho(); atualizarCamposEntrega();">
    <option value="Retirada">Retirada no local</option>
    <option value="Entrega">Entrega</option>
</select>

<div id="campos-entrega" style="display: none;">
    <label>Endereço:</label>
    <input type="text" id="endereco-cliente" placeholder="Rua, número, bairro">

    <label>Referência:</label>
    <input type="text" id="referencia-cliente" placeholder="Ex: próximo à praça">
</div>


<label>Forma de pagamento:</label>
<select id="pagamento-cliente">
    <option value="">Selecione</option>
    <option value="Pix">Pix</option>
    <option value="Dinheiro">Dinheiro</option>
    <option value="Cartão de Crédito">Cartão de Crédito</option>
    <option value="Cartão de Débito">Cartão de Débito</option>
</select>

</div>

            <div class="botoes-carrinho">
                <button class="btn-limpar" onclick="limparCarrinho()">
                    Limpar Carrinho
                </button>

                <a href="index.html" class="btn-voltar">
                    Continuar Comprando
                </a>

                
<button id="btn-finalizar" class="btn-finalizar" onclick="finalizarPedido()">
    Finalizar Pedido
</button>

            </div>
        </div>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
